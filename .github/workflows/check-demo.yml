name: Check demo data

on:
  push:
    paths: ['.github/workflows/check-demo.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Live check before the presentation (read only)
        run: |
          API=https://renderia-backend.onrender.com/api/v1
          note() { echo "::notice title=$1::$2"; }
          note frontend "$(curl -s -o /dev/null -w '%{http_code} %{time_total}s' --max-time 60 https://renderia-frontend.vercel.app/)"
          note backend "$(curl -s -w ' %{time_total}s' --max-time 150 $API/health)"
          note ia "$(curl -s -w ' %{time_total}s' --max-time 150 https://renderia-ai.onrender.com/health)"
          TOKEN=$(curl -s -X POST "$API/auth/demo" -H 'Content-Type: application/json' -d '{"role":"Ingeniero"}' | jq -r .token)
          H="Authorization: Bearer $TOKEN"
          STORE=$(curl -s "$API/floor-plans" -H "$H" | jq -r '[.[] | select(.fileName=="retail-store-floor-plan.svg")][0].id')
          note "local panamericana (detector local)" "$(curl -s -o b.json -w '%{http_code} %{time_total}s' --max-time 200 -X POST $API/ai/analyze -H "$H" -H 'Content-Type: application/json' -d "{\"floorPlanId\":$STORE,\"aiModelId\":2,\"scale\":\"1:100\"}") elementos=$(jq '.elements|length' b.json)"
          note "torre galeras plano 22 (gemini)" "$(curl -s -o g.json -w '%{http_code} %{time_total}s' --max-time 240 -X POST $API/ai/analyze -H "$H" -H 'Content-Type: application/json' -d '{"floorPlanId":22,"aiModelId":30,"scale":"1:100"}') elementos=$(jq '.elements|length' g.json) $(head -c 160 g.json | tr '\n' ' ')"
