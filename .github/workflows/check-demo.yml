name: Check demo data

on:
  push:
    paths: ['.github/workflows/check-demo.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: List the 3D models each demo account sees
        run: |
          API=https://renderia-backend.onrender.com/api/v1
          curl -s --max-time 120 "$API/health" > /dev/null
          for role in Ingeniero Estudiante Administrador Revisor Cliente; do
            TOKEN=$(curl -s --max-time 60 -X POST "$API/auth/demo" -H 'Content-Type: application/json' -d "{\"role\":\"$role\"}" | jq -r .token)
            H="Authorization: Bearer $TOKEN"
            P=$(curl -s --max-time 60 "$API/projects" -H "$H" | jq -c '[.[] | .name]')
            A=$(curl -s --max-time 60 "$API/analyses" -H "$H" | jq -c '[.[] | select(.status=="COMPLETED") | .floorPlanId] | unique | length')
            echo "::notice title=$role::proyectos=$P | planos con modelo 3D=$A"
          done
