name: Check demo data

on:
  push:
    paths: ['.github/workflows/check-demo.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Floors per sample project
        run: |
          API=https://renderia-backend.onrender.com/api/v1
          curl -s --max-time 120 "$API/health" > /dev/null
          TOKEN=$(curl -s --max-time 60 -X POST "$API/auth/demo" -H 'Content-Type: application/json' -d '{"role":"Revisor"}' | jq -r .token)
          H="Authorization: Bearer $TOKEN"
          curl -s "$API/projects" -H "$H" > p.json; curl -s "$API/floor-plans" -H "$H" > f.json; curl -s "$API/analyses" -H "$H" > a.json
          OUT=$(jq -r --slurpfile f f.json --slurpfile a a.json '.[] | . as $p | ($f[0] | map(select(.projectId == $p.id))) as $plans | "\($p.name): \($plans|length) pisos, \([$plans[].id as $id | $a[0][] | select(.floorPlanId == $id and .status == "COMPLETED")] | length) analizados"' p.json | tr '\n' ';')
          echo "::notice title=demo::$OUT"
