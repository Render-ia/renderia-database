name: Check demo data

on:
  push:
    paths: ['.github/workflows/check-demo.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Torre Galeras floors
        run: |
          API=https://renderia-backend.onrender.com/api/v1
          TOKEN=$(curl -s -X POST "$API/auth/demo" -H 'Content-Type: application/json' -d '{"role":"Ingeniero"}' | jq -r .token)
          H="Authorization: Bearer $TOKEN"
          F=$(curl -s "$API/projects/6/floor-plans" -H "$H" | jq -c '[.[].floorLevel] | sort')
          N=$(curl -s "$API/analyses" -H "$H" | jq --argjson ids "$(curl -s "$API/projects/6/floor-plans" -H "$H" | jq -c '[.[].id]')" '[.[] | select(.status=="COMPLETED" and (.floorPlanId as $x | $ids | index($x)))] | length')
          echo "::notice title=Torre Galeras::pisos $F, análisis completos $N"
